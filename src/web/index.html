<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<!-- The app is dark already: tells the Dark Reader extension to leave it alone (it re-styles every node, and the grid has thousands). -->
<meta name="darkreader-lock">
<title>TuvaVideos</title>
<link rel="icon" type="image/svg+xml" href="/olchey.svg">
<!-- The app is offline: the web fonts are a progressive enhancement. The stylesheet loads without blocking render and
     every font stack in styles.css ends in system fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
